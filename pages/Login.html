<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GABLE – Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css?v=2">
    <link rel="stylesheet" href="../assets/css/login.css">   <link rel="stylesheet" href="../assets/css/lucide-icons.css">
<link rel="stylesheet" href="../assets/css/actions.css">
</head>

<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="particles" id="particles"></div> <a href="Index.html" class="back-link">Back to Home</a>
    <div class="login-card">
        <div class="lock-wrap">
            <div class="lock-icon lucide-icon"><i data-lucide="lock" aria-hidden="true"></i></div>
        </div>
        <h1>Welcome Back</h1>
        <p class="login-subtitle">Login to continue your learning journey</p>
        <!-- ROLE SELECT -->
        <div class="form-group"> <label>Select Your Role</label>
            <div class="select-wrap"> <select id="role" onchange="onRoleChange()"> <option value="student">Student</option> <option value="instructor">Instructor</option> <option value="admin">Admin</option> </select> <span class="select-arrow">▼</span> </div>
        </div>
        <div class="id-field-wrap visible" id="id-field-wrap">
            <div class="form-group" style="margin-bottom:0"> <label id="id-label">Student Number</label>
                <div class="id-input-row"> <input type="text" id="id-input" placeholder="Enter your Student Number" autocomplete="username"> </div>
                <div class="error-msg" id="id-error"></div>
            </div>
        </div>
        <!-- PASSWORD -->
        <div class="form-group" id="password-wrap"> <label>Password</label>
            <div class="input-wrap"> <input type="password" id="password" placeholder="Enter your password"> <button class="toggle-pw lucide-icon" id="togglePw" type="button"><i data-lucide="eye" aria-hidden="true"></i></button> </div>
            <div class="error-msg" id="pw-error">Incorrect password. Please try again.</div>
        </div> <button class="btn-login-submit" id="loginBtn">Login</button> </div> <a href="Help.html" class="help-bubble">?</a>
    <div class="toast" id="toast"><span id="toast-icon">✅</span>&nbsp;<span id="toast-msg"></span></div>
    <script src="../assets/js/main.js?v=7"></script>
    <script src="../assets/js/login.js?v=2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../assets/js/lucide-emoji.js"></script>
</body>

</html>
